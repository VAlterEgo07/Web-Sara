<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Darling Dolls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-auth">

    <div class="auth-card">
        <a href="index.html" class="auth-logo">Darling Dolls</a>
        <h2 id="auth-title">Comenzar tu aventura</h2>
        <p class="auth-subtitle">Inicia sesión o crea tu cuenta para guardar tus compras y suscripciones</p>

        <!-- Botón de Google OAuth -->
        <button id="btn-google-auth" class="btn-google">
            <img src="https://www.google.com/favicon.ico" alt="Google logo">
            Continuar con Google
        </button>

        <div class="auth-divider"><span>o usa tu correo</span></div>

        <!-- Formulario Tradicional -->
        <form id="auth-form" onsubmit="event.preventDefault();">
        <div class="form-group" id="group-nombre" style="display: none;">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Tu nombre y apellidos">
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
            
            <button type="submit" id="btn-submit-auth" class="btn-auth-action">Ingresar / Registrarse</button>
        </form>

        <div class="auth-toggle-mode">
            <p id="toggle-text">¿No tienes cuenta? <a href="#" id="auth-toggle-link">Regístrate aquí</a></p>
        </div>
    </div>

    <!-- 1. Importar la librería de Supabase desde su CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Importar tu script de autenticación (debe ir DESPUÉS de Supabase) -->
    <script src="config.js"></script>
    <script src="auth.js"></script>

</body>
</html>
