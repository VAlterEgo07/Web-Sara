<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inkwell Studios - Tienda Oficial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">Inkwell Studios</a>
            <ul class="nav-links">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#tienda">Tienda</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </div>
    </nav>

    <header id="inicio" class="hero">
        <div class="hero-content">
            <h1>Bienvenidos a Inkwell Studios</h1>
            <p>Explora nuestras últimas creaciones, merchandising exclusivo y proyectos independientes.</p>
            <a href="#tienda" class="btn-primary">Ver Catálogo</a>
        </div>
    </header>

    <main id="tienda" class="store-section">
        <h2 class="section-title">Nuestros Productos</h2>
        
        <div id="catalogo" class="grid-productos">
            
            <div class="tarjeta-producto">
                <div class="img-placeholder"></div>
                <h3>Producto de Muestra</h3>
                <p class="precio">0.00 €</p>
                <button class="btn-buy">Añadir al carrito</button>
            </div>

        </div>
    </main>

</body>
</html>
